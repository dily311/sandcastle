# cargo clean
# 안드로이드 체크: cargo check --target aarch64-linux-android

[package]
name = "sandcastle"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "sandcastle"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
# 프론트 바인딩(src/ipc/bindings.ts) 생성: cargo run --bin export-bindings
# (테스트 실행 파일에는 Windows 공용 컨트롤 매니페스트가 없어서 Tauri 런타임을 쓰는 코드를 테스트로 돌릴 수 없다)
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sandcastle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset",  "tray-icon" ] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2.4.5"
tauri-plugin-store = "2.4.2"
tauri-plugin-os = "2.3.2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2.0.0"
tauri-plugin-background-service = "1.0"
tauri-plugin-notification = "2"

async-trait = "0.1"
anyhow = "1.0.104"
thiserror = "2.0.20"
base64 = "0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# webpki-roots: 루트 인증서를 바이너리에 넣는다. 기본(native roots)은 Android에서 OS 인증서를 읽지 못해
# 서비스 계정 토큰을 받지 못했다(Vertex 연결 실패, 0.2.0 실기기). reqwest(rustls-tls)와 같은 방식
gcp_auth = { version = "0.12", features = ["webpki-roots"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "tls-rustls", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"
keyring = "4.2.0"
futures = "0.3.34"
mime_guess = "2.0.5"
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7.20"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
zip = "8.6.0"
sha2 = "0.11"
lofty = "0.24.0"
image = { version = "0.25", features = ["webp"] }
infer = "0.22.0"
tiktoken = "4.1.2"
strum = "0.26"
strum_macros = "0.26"
fancy-regex = "0.20.2"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.28", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.15"
notify = "6.1" # 파일 시스템 감시

# Android: keyring v4는 Android 저장소가 없어 Keystore 기반 저장소를 직접 쓴다 (1-C-2, secret_store.rs)
[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
keyring-core = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.7.0"

# [dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
