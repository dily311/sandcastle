name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 버전이 한 곳과 같은지 (package.json · Cargo.toml · tauri.conf.json)
        run: node scripts/version.mjs
      - name: 타입 검사
        run: pnpm check
      - name: 테스트
        run: pnpm test:run
      - name: 빌드
        run: pnpm build

  rust:
    # 대상 플랫폼이 Windows라 시스템 WebView 패키지 설치 없이 바로 빌드된다
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri::generate_context!가 frontendDist(../dist)를 요구한다
      - name: 빈 dist 만들기
        shell: bash
        run: mkdir -p ../dist && touch ../dist/index.html
      - name: 서식 (cargo fmt)
        run: cargo fmt --check
      - name: 테스트
        run: cargo test
      - name: 프론트 바인딩이 최신인지 확인
        shell: bash
        run: |
          cargo run --bin export-bindings
          git diff --exit-code -- ../src/ipc/bindings.ts
      - name: Clippy
        run: cargo clippy --all-targets

  android:
    # Android 대상으로 Rust가 컴파일되는지만 본다 (1-D-2). APK는 릴리스 워크플로가 만든다.
    # GitHub의 ubuntu 러너에는 Android NDK가 깔려 있다 (ANDROID_NDK_LATEST_HOME)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      - name: 빈 dist 만들기
        run: mkdir -p ../dist && touch ../dist/index.html
      - name: NDK 컴파일러 연결
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - name: Clippy (aarch64-linux-android)
        run: cargo clippy --lib --target aarch64-linux-android

  e2e:
    # 실제 앱(디버그 빌드)을 띄워 스모크 시험 (1-D-1): 시작 → 캐릭터 가져오기 → 가짜 공급자로 메시지 → 백업.
    # 요금이 드는 API는 부르지 않는다. Windows: 자격 증명 관리자(API 키)와 WebView2 드라이버가 있어 화면 없이 돈다
    runs-on: windows-latest
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: e2e
      - run: pnpm install --frozen-lockfile
      - name: tauri-driver 설치
        run: cargo install tauri-driver --locked
      # 앱이 실제로 쓰는 WebView2와 같은 버전의 msedgedriver — Tauri 공식 안내(tauri.app/develop/tests/webdriver/ci)의 방법.
      # 예전에는 레지스트리의 버전으로 받았는데, 러너에서 앱이 쓰는 런타임과 달라 세션을 못 만들었다(DevToolsActivePort)
      - name: WebView2와 같은 버전의 msedgedriver
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\edgedriver" | Out-Null
          Push-Location "$env:RUNNER_TEMP\edgedriver"
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          Pop-Location
          "$env:RUNNER_TEMP\edgedriver" >> $env:GITHUB_PATH
          & "$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" --version
          # 드라이버를 자세한 기록과 함께 띄우는 감싸기 (러너에서만 세션이 안 만들어지는 원인 찾기)
          $wrap = "$env:RUNNER_TEMP\edgedriver\msedgedriver-logged.cmd"
          "@`"$env:RUNNER_TEMP\edgedriver\msedgedriver.exe`" --verbose --log-path=`"$env:RUNNER_TEMP\msedgedriver.log`" %*" | Set-Content -Encoding ascii $wrap
          "MSEDGEDRIVER=$wrap" >> $env:GITHUB_ENV
      - name: 앱 빌드 (E2E용 identifier)
        run: pnpm e2e:build
      # 새 러너에서 WebView2가 처음 뜰 때는 오래 걸려 드라이버의 60초 대기를 넘기고, 드라이버가 앱만 죽이면
      # 남은 msedgewebview2가 다음 시도까지 붙잡아(디버깅 포트 없이) 세션이 끝내 안 만들어졌다.
      # 그래서 앱을 한 번 먼저 띄워 WebView2를 데우고, 앱과 남은 WebView2 프로세스를 모두 끈다 (러너에는 다른 WebView2가 없음)
      - name: WebView2 데우기
        shell: pwsh
        run: |
          $p = Start-Process "src-tauri\target\debug\sandcastle.exe" -PassThru
          Start-Sleep -Seconds 40
          if (-not $p.HasExited) { Stop-Process $p -Force }
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          Write-Host "남은 WebView2 프로세스: $((Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count)"
      - name: E2E
        run: pnpm e2e
        env:
          RUST_BACKTRACE: "1"
      # 실패하면 원인을 남긴다: 앱의 panic 기록, WebView2·드라이버 버전
      - name: 실패 원인 (panic 기록·버전)
        if: failure()
        shell: pwsh
        run: |
          $log = "$env:APPDATA\com.dilly311.sandcastle.e2e\logs\panic.log"
          if (Test-Path $log) { Get-Content $log -Tail 80 } else { Write-Host "panic.log 없음" }
          $key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          Write-Host "WebView2 런타임(레지스트리): $((Get-ItemProperty $key -ErrorAction SilentlyContinue).pv)"
          Write-Host "Edge: $((Get-Item 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' -ErrorAction SilentlyContinue).VersionInfo.ProductVersion)"
          Write-Host "--- msedgedriver 기록 (처음 시도 부분과 끝부분)"
          if (Test-Path "$env:RUNNER_TEMP\msedgedriver.log") {
            Get-Content "$env:RUNNER_TEMP\msedgedriver.log" | Select-String -Pattern "Launching|Failed to connect|RESPONSE InitSession|DevToolsActivePort|USER_DATA|user-data" | Select-Object -First 20 | ForEach-Object { $_.Line.Substring(0, [Math]::Min(300, $_.Line.Length)) }
            Get-Content "$env:RUNNER_TEMP\msedgedriver.log" -Tail 60
          } else { Write-Host "기록 없음" }
          Write-Host "--- 남은 WebView2 프로세스: $((Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count)"
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "--- Edge·WebView2 정책"
          foreach ($k in "HKLM:\SOFTWARE\Policies\Microsoft\Edge", "HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2", "HKCU:\SOFTWARE\Policies\Microsoft\Edge") { if (Test-Path $k) { Write-Host $k; Get-ItemProperty $k | Out-String | Write-Host } }
          # 드라이버 없이 앱만 띄워 본다 (원격 디버깅 포트를 열어 달라고 해서): 20초 뒤 살아 있는지, 포트가 열렸는지
          Get-Process sandcastle -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = "src-tauri\target\debug\sandcastle.exe"
          $env:RUST_BACKTRACE = "1"
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9229"
          $p = Start-Process $exe -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\app.out" -RedirectStandardError "$env:RUNNER_TEMP\app.err"
          Start-Sleep -Seconds 20
          Write-Host "--- 앱이 도는 동안의 WebView2 프로세스 (명령줄)"
          Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Select-Object -First 3 | ForEach-Object { Write-Host ($_.CommandLine.Substring(0, [Math]::Min(700, $_.CommandLine.Length))) }
          Write-Host "WebView2 프로세스 수: $((Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count)"
          Write-Host "세션: $((Get-Process -Id $PID).SessionId), 사용자: $env:USERNAME, 대화형: $([Environment]::UserInteractive)"
          try { $j = Invoke-RestMethod "http://127.0.0.1:9229/json/version" -TimeoutSec 5; Write-Host "원격 디버깅 열림: $($j.Browser)" } catch { Write-Host "원격 디버깅 안 열림: $($_.Exception.Message)" }
          if ($p.HasExited) { Write-Host "앱이 스스로 끝남: 종료 코드 $($p.ExitCode) (0x$('{0:X}' -f $p.ExitCode))" } else { Write-Host "앱이 20초 동안 살아 있음 (창 $($p.MainWindowTitle))"; Stop-Process $p -Force }
          Write-Host "--- stdout"; Get-Content "$env:RUNNER_TEMP\app.out" -Tail 40
          Write-Host "--- stderr"; Get-Content "$env:RUNNER_TEMP\app.err" -Tail 60
          Write-Host "--- 앱 데이터"; Get-ChildItem "$env:APPDATA\com.dilly311.sandcastle.e2e" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          Write-Host "--- WebView2 데이터"; Get-ChildItem "$env:LOCALAPPDATA\com.dilly311.sandcastle.e2e" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          if (Test-Path $log) { Write-Host "--- panic.log (앱만 띄운 뒤)"; Get-Content $log -Tail 80 }
